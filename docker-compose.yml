services:
  itmo-high-load-system-1lab-1:
    image: itmo-high-load-system-1lab:dev
    build: .
    environment:
      POD_ID: "1"
      DATACENTER: dc1
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  itmo-high-load-system-1lab-2:
    image: itmo-high-load-system-1lab:dev
    build: .
    environment:
      POD_ID: "2"
      DATACENTER: dc2
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  dashboard-generator:
    build:
      context: .
      dockerfile: cmd/dashboard-generator/Dockerfile
    environment:
      APP_URL: http://itmo-high-load-system-1lab-1:8080
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:?Set GRAFANA_ADMIN_USER in .env}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
    depends_on:
      itmo-high-load-system-1lab-1:
        condition: service_healthy
      itmo-high-load-system-1lab-2:
        condition: service_healthy
      grafana:
        condition: service_healthy
    restart: "no"

  load:
    build: ./load
    depends_on:
      itmo-high-load-system-1lab-1:
        condition: service_healthy
      itmo-high-load-system-1lab-2:
        condition: service_healthy
      dashboard-generator:
        condition: service_completed_successfully
    stop_grace_period: 10s

volumes:
  prometheus-data:
  grafana-data:
